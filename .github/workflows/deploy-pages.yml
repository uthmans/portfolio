name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check project calculations and validation
        run: npm test
      - name: Verify Cloudflare Worker bundle
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run worker:check
          npm run worker:test
      - name: Type-check and build
        env:
          VITE_FEEDBACK_API_URL: https://portfolio.uthmansalama.workers.dev/api/feedback
        run: npm run build
      - name: Report deployment revision
        run: |
          printf '### Portfolio deployment\n\nCommit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Verified pages: portfolio, survey, business, three service pages, and freelancer hub.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload production website
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
